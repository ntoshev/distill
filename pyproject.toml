[project]
name = "distil"
version = "0.1.0"
description = "Visualize token likelihood and distill context into MLX LoRA adapters"
readme = "README.md"
authors = [
    { name = "Nikola Toshev", email = "312759+ntoshev@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlx<0.32",
    "mlx-lm>=0.31.3",
    "rich>=13.0",
]

[project.scripts]
distil = "distil.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "benchmark: timing regression tests selected by a system-specific baseline",
    "model: tests that load the local mlx model (slow, needs cached weights)",
    "slow: long-running tests excluded by default unless --run-slow is passed",
]
filterwarnings = [
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
